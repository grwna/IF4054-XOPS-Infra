---
- name: Provision Server Environment
  hosts: localhost
  connection: local
  become: true
  vars_files:
    - vars.yaml
  vars:
    kubectl_version: "v1.31.0"
    kind_version: "v0.24.0"
    kyverno_cli_version: "v1.19.2"
    gitlab_url: "https://gitlab-edu.itb.ac.id"

  tasks:
    # --- System Packages ---
    - name: Ensure base packages installed
      apt:
        name: [curl, tar, docker.io, python3-docker]
        state: present
        update_cache: yes

    - name: Ensure xops user is in the docker group
      user:
        name: xops
        groups: docker
        append: yes

    # --- Install and setup cloudflare tunnels ---
    - name: Download cloudflared deb package
      get_url:
        url: "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb"
        dest: /tmp/cloudflared.deb

    - name: Install cloudflared package
      apt:
        deb: /tmp/cloudflared.deb

    - name: Install and start cloudflared service
      command: "cloudflared service install {{ cf_token }}"
      args:
        creates: /etc/systemd/system/cloudflared.service

    # --- CLI Tools Installation ---
    - name: Install kubectl
      get_url:
        url: "https://dl.k8s.io/release/{{ kubectl_version }}/bin/linux/amd64/kubectl"
        dest: /usr/local/bin/kubectl
        mode: '0755'

    - name: Install Kind
      get_url:
        url: "https://kind.sigs.k8s.io/dl/{{ kind_version }}/kind-linux-amd64"
        dest: /usr/local/bin/kind
        mode: '0755'

    - name: Download and de-armor HashiCorp GPG key
      shell: |
        curl -fsSL https://apt.releases.hashicorp.com/gpg | gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
      args:
        creates: /usr/share/keyrings/hashicorp-archive-keyring.gpg

    - name: Add HashiCorp repository
      apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com noble main"
        state: present
        filename: hashicorp

    - name: Install Terraform via apt
      apt:
        name: terraform
        state: present
        update_cache: yes

    - name: Install Helm via official script
      shell: |
        curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      args:
        creates: /usr/local/bin/helm

    - name: Install Kyverno CLI
      unarchive:
        src: "https://github.com/kyverno/kyverno/releases/download/{{ kyverno_cli_version }}/kyverno-cli_{{ kyverno_cli_version }}_linux_x86_64.tar.gz"
        dest: /usr/local/bin/
        remote_src: yes
        mode: '0755'
        extra_opts: ['kyverno']
      args:
        creates: /usr/local/bin/kyverno

    # --- GitLab Runner Native Installation ---
    - name: Add GitLab Runner official repository
      shell: curl -L "https://packages.gitlab.com/install/repositories/runner/gitlab-runner/script.deb.sh" | bash
      args:
        creates: /etc/apt/sources.list.d/runner_gitlab-runner.list

    - name: Install GitLab Runner native package
      apt:
        name: gitlab-runner
        state: present

    - name: Ensure gitlab-runner user is in the docker group
      user:
        name: gitlab-runner
        groups: docker
        append: yes

    - name: Check runner registration state
      command: grep "wsl-kind-runner" /etc/gitlab-runner/config.toml
      register: runner_cfg
      failed_when: false
      changed_when: false

    - name: Register GitLab Runner directly
      command: >
        gitlab-runner register
        --non-interactive
        --url "{{ gitlab_url }}"
        --token "{{ gitlab_token }}"
        --executor "shell"
        --description "wsl-kind-runner"
      when: runner_cfg.rc != 0