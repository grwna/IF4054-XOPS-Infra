stages:
  - validate
  - deploy-cluster
  - deploy-infra
  - deploy-dev
  - deploy-prod

default:
  tags:
    - xops
  before_script:
    - kind export kubeconfig --name xops

# Kyverno CLI validation test suite
validate_policies:
  stage: validate
  script:
    - sh ./scripts/render-policies.sh
    - kyverno test ./generated/kyverno-policies/tests/

# Terraform: cluster + namespaces + ingress-nginx + kyverno + metrics-server
terraform_apply:
  stage: deploy-cluster
  resource_group: terraform
  timeout: 30m
  script:
    - terraform init
    - terraform apply -target=kind_cluster.xops -state=/home/gitlab-runner/terraform.tfstate -auto-approve
    - terraform apply -state=/home/gitlab-runner/terraform.tfstate -auto-approve
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main"'

# Deploy Kyverno ClusterPolicies to cluster
deploy_infra:
  stage: deploy-infra
  script:
    - sh ./scripts/render-policies.sh
    - kubectl apply -f generated/kyverno-policies/policies/
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main"'

# Automatic deployment to Dev environment (k8s namespace: dev)
deploy_dev:
  stage: deploy-dev
  script:
    - helm dependency build ./helm/charts/app
    - >-
      helm upgrade --install retail-app ./helm/charts/app -n dev
      --values ./helm/values/dev.yaml
      --set cart.image.repository=docker.io/${DOCKERHUB_NAMESPACE}/retail-store-cart
      --set catalog.image.repository=docker.io/${DOCKERHUB_NAMESPACE}/retail-store-catalog
      --set checkout.image.repository=docker.io/${DOCKERHUB_NAMESPACE}/retail-store-checkout
      --set orders.image.repository=docker.io/${DOCKERHUB_NAMESPACE}/retail-store-orders
      --set ui.image.repository=docker.io/${DOCKERHUB_NAMESPACE}/retail-store-ui
  environment:
    name: dev
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'

# Manual approval gate for Production deployment
deploy_prod:
  stage: deploy-prod
  script:
    - test -n "$APP_IMAGE_TAG"
    - test -n "$DOCKERHUB_NAMESPACE"
    - helm dependency build ./helm/charts/app
    - >-
      helm upgrade --install retail-app ./helm/charts/app -n prod
      --values ./helm/values/prod.yaml
      --set cart.image.repository=docker.io/${DOCKERHUB_NAMESPACE}/retail-store-cart
      --set cart.image.tag=$APP_IMAGE_TAG
      --set catalog.image.repository=docker.io/${DOCKERHUB_NAMESPACE}/retail-store-catalog
      --set catalog.image.tag=$APP_IMAGE_TAG
      --set checkout.image.repository=docker.io/${DOCKERHUB_NAMESPACE}/retail-store-checkout
      --set checkout.image.tag=$APP_IMAGE_TAG
      --set orders.image.repository=docker.io/${DOCKERHUB_NAMESPACE}/retail-store-orders
      --set orders.image.tag=$APP_IMAGE_TAG
      --set ui.image.repository=docker.io/${DOCKERHUB_NAMESPACE}/retail-store-ui
      --set ui.image.tag=$APP_IMAGE_TAG
  environment:
    name: prod
  when: manual
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
