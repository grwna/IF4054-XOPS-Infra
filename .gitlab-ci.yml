stages:
  - validate
  - deploy-cluster
  - deploy-infra
  - deploy-dev
  - deploy-prod

default:
  tags:
    - xops

variables:
  KUBECONFIG: /root/.kube/config

# Kyverno CLI validation (placeholder policies)
validate_policies:
  stage: validate
  image:
    name: ghcr.io/kyverno/kyverno-cli:latest
    entrypoint: [""]
  script:
    - kyverno test ./kyverno-policies/

# Terraform: cluster + namespaces + ingress-nginx + kyverno + metrics-server
# State persists on host via /root/tfstate mount (k8s.tf backend + server-setup.yaml runner volumes)
terraform_apply:
  stage: deploy-cluster
  image: hashicorp/terraform:1.17
  resource_group: terraform
  timeout: 30m
  script:
    - wget -qO /usr/local/bin/kind https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-amd64
    - chmod +x /usr/local/bin/kind
    - export TF_DATA_DIR=/root/tfstate/.terraform-cache
    - terraform init
    - terraform apply -target=kind_cluster.xops -auto-approve
    - terraform apply -auto-approve

# Deploy Kyverno ClusterPolicies to cluster
deploy_infra:
  stage: deploy-infra
  image: alpine:3.20
  script:
    - apk add --no-cache curl
    - curl -fsSL -o kubectl "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
    - chmod +x kubectl
    - ./kubectl apply -f kyverno-policies/require-team-label.yaml

# Automatic deployment to Dev environment (k8s namespace: dev)
deploy_dev:
  stage: deploy-dev
  image: alpine/helm:latest
  script:
    - helm upgrade --install retail-app ./helm-charts/retail-app -n dev --values ./helm-charts/retail-app/values-dev.yaml
  environment:
    name: dev

# Manual approval gate for Production deployment
deploy_prod:
  stage: deploy-prod
  image: alpine/helm:latest
  script:
    - helm upgrade --install retail-app ./helm-charts/retail-app -n prod --values ./helm-charts/retail-app/values-prod.yaml
  environment:
    name: prod
  when: manual  # Enforces mandatory 1-person approval rule
  only:
    - main
