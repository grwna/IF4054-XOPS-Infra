apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-image-registries
  annotations:
    policies.kyverno.io/title: Restrict Image Registries
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    pod-policies.kyverno.io/autogen-controllers: Deployment
    policies.kyverno.io/description: >-
      Spec requirement 3.b: "Image yang boleh dijalankan di cluster hanya
      yang berasal dari repositori Anda." Every container image must come
      from this team's Docker repository (starath/retail-store-*); images from
      Docker Hub library, public ECR, or any other unauthorized path are rejected.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: restrict-to-group-registry
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kyverno
      validate:
        message: >-
          Container image must come from this team's registry: starath/retail-store-*
        anyPattern:
          - spec:
              containers:
                - image: "starath/retail-store-*"
          - spec:
              containers:
                - image: "*starath/retail-store-*"
