apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-image-registries
  annotations:
    policies.kyverno.io/title: Restrict Image Registries
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    pod-policies.kyverno.io/autogen-controllers: Deployment
    policies.kyverno.io/description: >-
      Spec requirement 3.b: "Image yang boleh dijalankan di cluster hanya
      yang berasal dari repositori Anda." Every container image must come
      from this group's Docker Hub namespace (docker.io/starath/retail-store-*,
      confirmed from the app repo's DOCKERHUB_NAMESPACE CI/CD variable);
      images from any other registry or namespace are rejected. Update the
      pattern below if the group's Docker Hub namespace changes.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: restrict-to-group-registry
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kyverno
      validate:
        message: >-
          Container image must come from this group's Docker Hub namespace:
          docker.io/starath/retail-store-*
        pattern:
          spec:
            containers:
              - image: "docker.io/starath/retail-store-*"
