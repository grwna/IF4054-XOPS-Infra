apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-image-registries
  annotations:
    policies.kyverno.io/title: Restrict Image Registries
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    pod-policies.kyverno.io/autogen-controllers: Deployment
    policies.kyverno.io/description: >-
      Spec requirement 3.b: "Image yang boleh dijalankan di cluster hanya
      yang berasal dari repositori Anda." Every container image must come
      from this group's GitLab Container Registry path; images from Docker
      Hub, public ECR, or any other group's registry path are rejected.
      Update REGISTRY_PREFIX below if the group registry path changes.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: restrict-to-group-registry
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kyverno
      validate:
        message: >-
          Container image must come from this group's registry:
          registry.gitlab-edu.itb.ac.id/if4054-2026-t1-13523035-13523095-13523106/retail-store-app-xops/*
        pattern:
          spec:
            containers:
              - image: "registry.gitlab-edu.itb.ac.id/if4054-2026-t1-13523035-13523095-13523106/retail-store-app-xops/*"
