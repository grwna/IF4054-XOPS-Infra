replicaCount: 1
image:
  repository: nginxinc/nginx-unprivileged
  tag: alpine
ingress:
  host: retail-xops.local
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi
hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
