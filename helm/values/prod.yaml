# Environment overlay: prod
#
# Applied on top of each service chart's own values.yaml defaults via:
#   helm template retail helm/charts/app -f helm/values/prod.yaml --namespace prod
#
# image.tag below is a placeholder. The infra CI/CD pipeline promotes
# a release that already passed dev by pinning the exact commit-sha tag that was
# validated in dev, e.g. --set cart.image.tag=$RELEASE_SHA, after manual approval.
# prod never deploys :latest directly so the running candidate is always
# identifiable and reproducible.

cart:
  image:
    repository: starath/retail-store-cart
    tag: "6d89e76df85249c2b4de00a3c2515ec4e5c39f0e"
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

catalog:
  image:
    repository: starath/retail-store-catalog
    tag: "6d89e76df85249c2b4de00a3c2515ec4e5c39f0e"
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

checkout:
  image:
    repository: starath/retail-store-checkout
    tag: "6d89e76df85249c2b4de00a3c2515ec4e5c39f0e"
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

orders:
  image:
    repository: starath/retail-store-orders
    tag: "6d89e76df85249c2b4de00a3c2515ec4e5c39f0e"
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

ui:
  image:
    repository: starath/retail-store-ui
    tag: "6d89e76df85249c2b4de00a3c2515ec4e5c39f0e"
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  ingress:
    enabled: true
    className: nginx
    hosts:
      - retail.local
