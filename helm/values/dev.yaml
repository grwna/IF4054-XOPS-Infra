# Environment overlay: dev
#
# Applied on top of each service chart's own values.yaml defaults via:
#   helm template retail helm/charts/app -f helm/values/dev.yaml --namespace dev
#
# image.tag below is a placeholder for local/offline rendering and testing.
# The infra CI/CD pipeline is expected to override it per-run with:
#   --set cart.image.tag=$CI_COMMIT_SHORT_SHA (and so on for each service)
# so that dev always tracks the commit that triggered the pipeline.

cart:
  image:
    repository: docker.io/starath/retail-store-cart
    tag: latest
    pullPolicy: Always
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80

catalog:
  image:
    repository: docker.io/starath/retail-store-catalog
    tag: latest
    pullPolicy: Always
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80

checkout:
  image:
    repository: docker.io/starath/retail-store-checkout
    tag: latest
    pullPolicy: Always
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80

orders:
  image:
    repository: docker.io/starath/retail-store-orders
    tag: latest
    pullPolicy: Always
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80

ui:
  image:
    repository: docker.io/starath/retail-store-ui
    tag: latest
    pullPolicy: Always
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80
  ingress:
    enabled: true
    className: nginx
    hosts:
      - dev.retail.local
